# api.myflowmotion.cloud → studio-api (FastAPI)
server {
    server_name api.myflowmotion.cloud;

    listen 80;

    client_max_body_size 100M;  # Document-Upload

    # CORS: in der App selber via FastAPI middleware geregelt, hier nur passthrough
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;   # für Multi-Agent-Pipeline
        proxy_send_timeout 300;
    }
}

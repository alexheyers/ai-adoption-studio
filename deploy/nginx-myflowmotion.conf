# myflowmotion.cloud + www.myflowmotion.cloud → studio-web (Next.js)
server {
    server_name myflowmotion.cloud www.myflowmotion.cloud;

    # HTTP → wird durch Certbot später auf HTTPS umgestellt
    listen 80;

    client_max_body_size 50M;

    # Next.js Static-Assets aggressive cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}

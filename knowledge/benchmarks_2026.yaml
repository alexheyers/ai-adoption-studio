# ── ZIELE / SOLL-WERTE für 2026/2027 ─────────────────────────────────
# Diese werden vom Use-Case-Generator als Soll-Werte für Roadmap-Outcomes herangezogen

target_state:
  email_response_hours_max: 4          # Branchen-Best-Practice
  review_response_rate_min: 0.85       # Google + Booking + TripAdvisor zusammen
  ota_provision_quote_max: 0.08        # absolutes Top-Niveau in Boutique-Segmenten
  direktbuchungs_quote_min: 0.50       # ambitioniert aber erreichbar
  dienstplan_aufwand_h_per_week_max: 2 # mit Software statt Excel

      Atomize (als Mews-Produkt) und BEONx den SMB-Markt angreifen. Prägender Trend
      ist die Konsolidierung von RMS und PMS (Mews+Atomize-Akquisition) sowie die
      tiefe Integration von Market Intelligence in den Pricing-Algorithmus (BEONx+Lighthouse).

    note: "US-basiert, lowest-latency Voice-AI"

# ── DOCUMENT PROCESSING / OCR ─────────────────────────────────
document_ai:
  - vendor: "GPT-4V (OpenAI)"
    use_cases: ["Belegerkennung", "PDF-zu-Strukturiert", "Chart-Extraction"]

  - vendor: "Claude 4.6/4.7 Vision"
    use_cases: ["Wie GPT-4V + besseres deutsches Verständnis"]

  - vendor: "Mistral Document AI"
    eu_hosting: true
    use_cases: ["DSGVO-konforme Belegerkennung"]

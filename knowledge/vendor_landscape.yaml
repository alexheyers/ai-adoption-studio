    eu_hosting: true
    monthly_cost_eur: { S: 17, M: 65 }
    fit: [familienbetrieb, boutique, gastronomie_voll]

  - vendor: "DATEV Unternehmen Online"
    tier: smb_to_enterprise
    eu_hosting: true
    monthly_cost_eur: { S: 25, M: 95, L: 240 }
    strengths: ["Stammlösung für deutsche Steuerberater-Anbindung"]

# ── LLM / KI-INFRASTRUKTUR (für Eigenbau-Workflows) ─────────────────────────────────
llm_infrastructure:
  - vendor: "Anthropic Claude API (Sonnet 4.6 + Haiku 4.5)"
    eu_hosting: false
    note: "US-Hosting · AVV verfügbar · Daten werden nicht für Training genutzt (per Default)"
    pricing_per_million_tokens_eur:
      sonnet_input: 2.8
      sonnet_output: 14.0
      haiku_input: 0.7
      haiku_output: 3.5

  - vendor: "Mistral Large 2 (Mistral AI, EU)"
    eu_hosting: true
    note: "Französischer Anbieter, EU-Hosting · DSGVO-vorteilhaft"
    pricing_per_million_tokens_eur:
      input: 1.8
      output: 5.4
    watch_outs: ["Schwächer bei feinem Deutsch + Branchen-Reasoning als Claude"]

  - vendor: "Aleph Alpha Pharia (Deutscher Anbieter)"
    eu_hosting: true
    note: "Deutsches Modell, EU-Hosting · Government + Enterprise-Fokus"
    watch_outs: ["Pricing nur auf Anfrage, weniger reif als Claude/GPT"]

  - vendor: "OpenAI GPT-4o / GPT-4o-mini"
    eu_hosting: false
    note: "EU Data Residency seit 2024 verfügbar (kostenpflichtig)"

# ── AUTOMATION / INTEGRATION ─────────────────────────────────
automation:
  - vendor: "n8n (self-hosted)"
    eu_hosting: true
    note: "VPS-Self-Hosting · DSGVO-konform mit eigenem Hosting"
    monthly_cost_eur: { S: 25, M: 45, L: 95, note: "Nur VPS-Kosten" }
    strengths: ["Open-Source, volle Kontrolle, gigantische Integrations-Library"]

  - vendor: "Make (ehem. Integromat)"
    tier: bootstrap_to_smb
    eu_hosting: true
    monthly_cost_eur: { S: 12, M: 35, L: 95 }
    strengths: ["No-Code, EU-Hosting"]

  - vendor: "Zapier"
    eu_hosting: false
    note: "US-Hosting, EU-Hosting limited"
    monthly_cost_eur: { S: 22, M: 75, L: 195 }

# ── VOICE-AI ─────────────────────────────────
voice_ai:
  - vendor: "ElevenLabs Conversational AI"
    eu_hosting: false
    note: "US-basiert, AVV vorhanden"
    monthly_cost_eur: { starter: 5, creator: 22, pro: 110, scale: 330 }
